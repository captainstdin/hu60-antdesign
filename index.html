<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const theme = JSON.parse(localStorage.getItem('hu60.pc.theme') || '"light"')
          const safeTheme = ['light', 'cyberpunk', 'dark'].includes(theme) ? theme : 'light'
          document.documentElement.dataset.theme = safeTheme
          document.documentElement.style.colorScheme = safeTheme === 'light' ? 'light' : 'dark'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#178f80" />
    <meta name="description" content="虎绿林 PC 社区" />
    <link rel="icon" href="https://hu60.cn/favicon.ico" />
    <title>虎绿林</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
